services:
  spark-master:
    image: apache/spark-py:latest
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-1:
    build:
      dockerfile: Dockerfile.worker
    container_name: spark-1
    hostname: spark-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master

  spark-2:
    build:
      dockerfile: Dockerfile.worker
    container_name: spark-2
    hostname: spark-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master

  spark-driver:
    build:
      context: .
      dockerfile: Dockerfile.driver
    container_name: spark-driver
    hostname: spark-driver
    ports:
      - "4040:4040"
    depends_on:
      - spark-master
      - spark-1
      - spark-2
      - broker
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_TOPIC: instagram-users
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_TABLE: instagram_users

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
       - postgres-data:/var/lib/postgresql/data

  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  producer:
    build:
      dockerfile: Dockerfile.producer
    container_name: producer
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./producer/data/:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_TOPIC: instagram-users
      BATCH_SIZE: 2000
      DELAY_SECONDS: 30
      CSV_FILE: instagram_usage_lifestyle_10000.csv

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    depends_on:
      - broker

volumes:
  postgres-data:
  kafka-data:
